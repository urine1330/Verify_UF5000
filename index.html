<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urinalysis Method Comparison</title>
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ไลบรารี สแกนบาร์โค้ดผ่านกล้อง -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body { 
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .form-container {
            background-color: #ffffff; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px; margin-top: 40px; margin-bottom: 40px;
        }
        .step { display: none; animation: fadeIn 0.5s; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); }
        }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .step-indicator::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0;
            height: 3px; background-color: #e9ecef; z-index: 1; transform: translateY(-50%);
        }
        .step-dot {
            width: 35px; height: 35px; border-radius: 50%; background-color: #e9ecef; color: #6c757d;
            display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; z-index: 2; transition: all 0.3s;
        }
        .step-dot.active { background-color: #0d6efd; color: white; box-shadow: 0 0 0 5px rgba(13, 110, 253, 0.2); }
        .step-dot.completed { background-color: #198754; color: white; }
        label { font-weight: 600; color: #495057; margin-top: 10px; margin-bottom: 5px; font-size: 0.88rem; }
        .tracking-widest { letter-spacing: 0.15em; }
        
        .conditional-box {
            background-color: #f8f9fa; border-left: 4px solid #0d6efd; padding: 15px; border-radius: 6px; margin-top: 10px; display: none;
        }
        .conditional-box-2 {
            background-color: #f4f6f9; border-left: 4px solid #17a2b8; padding: 15px; border-radius: 6px; margin-top: 10px; display: none;
        }
        .conditional-box-3 {
            background-color: #fff9e6; border-left: 4px solid #ffc107; padding: 15px; border-radius: 6px; margin-top: 10px; display: none;
        }
        
        #reader { width: 100%; max-width: 500px; margin: 15px auto; display: none; border-radius: 10px; overflow: hidden; border: 2px solid #0d6efd;}
    </style>
</head>
<body>

<div class="container max-w-100" style="max-width: 850px;">
    <div class="form-container">
        <h3 class="text-center mb-4 text-primary fw-bold">บันทึกผล Urinalysis</h3>
        
        <!-- Progress Bar (4 Steps) -->
        <div class="step-indicator">
            <div class="step-dot active" id="dot-0">1</div>
            <div class="step-dot" id="dot-1">2</div>
            <div class="step-dot" id="dot-2">3</div>
            <div class="step-dot" id="dot-3">4</div>
        </div>

        <form id="urinalysisForm">
            
            <!-- ================= Step 1: ข้อมูลทั่วไป ================= -->
            <div class="step active" id="step-0">
                <h5 class="text-secondary border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-clipboard-user me-2"></i>ส่วนที่ 1: ข้อมูลทั่วไป
                </h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>ประทับเวลา (Timestamp)</label>
                        <input type="text" class="form-control bg-light" name="ประทับเวลา" id="timestampInput" required readonly>
                    </div>

                    <div class="col-md-6">
                        <label>ผู้ทวนสอบ <span class="text-danger">*</span></label>
                        <select class="form-select" name="ผู้ทวนสอบ" id="reviewerSelect" required>
                            <option value="" selected disabled>-- เลือกผู้ทวนสอบ --</option>
                            <option value="สิรินทร">สิรินทร</option>
                            <option value="เรวดี">เรวดี</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>อาคาร <span class="text-danger">*</span></label>
                        <select class="form-select" name="อาคาร" id="buildingSelect" required>
                            <option value="" selected disabled>-- เลือกอาคาร --</option>
                            <option value="อาคาร1">อาคาร1</option>
                            <option value="SDMC">SDMC</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Urine Sediment Analyser <span class="text-danger">*</span></label>
                        <select class="form-select" name="Urine Sediment Analyser" id="analyserSelect" required>
                            <option value="" selected disabled>-- เลือกเครื่อง --</option>
                            <option value="UF5000">UF5000</option>
                            <option value="UC1000">UC1000</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ================= Step 2: สแกนบาร์โค้ด ================= -->
            <div class="step" id="step-1">
                <h5 class="text-primary border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-barcode me-2"></i>ส่วนที่ 2: หมายเลขตัวอย่าง
                </h5>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="fs-5 text-primary">
                            หมายเลขบนตัวอย่าง (9 - 20 หลัก) <span class="text-danger">*</span>
                        </label>
                        
                        <div class="input-group input-group-lg mt-2">
                            <input type="text" class="form-control border-primary text-center fw-bold fs-3 tracking-widest" 
                                   name="หมายเลขบนตัวอย่าง" id="sampleId" 
                                   maxlength="20" placeholder="สแกน หรือ พิมพ์ตัวเลข 9-20 หลัก..." required>
                            
                            <button class="btn btn-primary" type="button" id="startCameraBtn" onclick="startCameraScan()">
                                <i class="fa-solid fa-camera"></i> เปิดกล้อง
                            </button>
                            
                            <button class="btn btn-outline-danger" type="button" onclick="clearBarcode()">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div id="reader"></div>

                        <div id="barcodeHelper" class="form-text text-center text-muted mt-2">
                            กดปุ่ม "เปิดกล้อง" เพื่อสแกน หรือใช้เครื่องสแกนบาร์โค้ดยิงที่ช่องนี้ (9-20 หลัก)
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= Step 3: ผลจากกล้องจุลทรรศน์ (Manual) ================= -->
            <div class="step" id="step-2">
                <h5 class="text-info border-bottom pb-2 mb-3">
                    <i class="fa-solid fa-microscope me-2"></i>ส่วนที่ 3: ผลจากกล้องจุลทรรศน์ (Manual)
                </h5>
                <div class="row g-3">
                    
                    <!-- WBC -->
                    <div class="col-md-6">
                        <label>White blood cell ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                        <select class="form-select" name="White blood cell ผลจากกล้องจุลทรรศน์ [/HPF]">
                            <option value="" selected>-- เลือกค่า --</option>
                            <option value="Negative">Negative</option>
                            <option value="0-1">0-1</option>
                            <option value="1-2">1-2</option>
                            <option value="2-3">2-3</option>
                            <option value="3-5">3-5</option>
                            <option value="5-10">5-10</option>
                            <option value="10-15">10-15</option>
                            <option value="15-20">15-20</option>
                            <option value=">20">&gt;20</option>
                            <option value=">50">&gt;50</option>
                            <option value=">100">&gt;100</option>
                        </select>
                    </div>

                    <!-- RBC -->
                    <div class="col-md-6">
                        <label>Red blood cell ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                        <select class="form-select" name="Red blood cell ผลจากกล้องจุลทรรศน์ [/HPF]">
                            <option value="" selected>-- เลือกค่า --</option>
                            <option value="Negative">Negative</option>
                            <option value="0-1">0-1</option>
                            <option value="1-2">1-2</option>
                            <option value="2-3">2-3</option>
                            <option value="3-5">3-5</option>
                            <option value="5-10">5-10</option>
                            <option value="10-15">10-15</option>
                            <option value="15-20">15-20</option>
                            <option value=">20">&gt;20</option>
                            <option value=">50">&gt;50</option>
                            <option value=">100">&gt;100</option>
                        </select>
                    </div>

                    <!-- Squamous Epithelial Cell -->
                    <div class="col-md-6">
                        <label>Squamous Epithelial Cell ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                        <select class="form-select" name="Squamous Epithelial Cell ผลจากกล้องจุลทรรศน์ [/HPF]">
                            <option value="" selected>-- เลือกค่า --</option>
                            <option value="Negative">Negative</option>
                            <option value="0-1">0-1</option>
                            <option value="1-2">1-2</option>
                            <option value="2-3">2-3</option>
                            <option value="3-5">3-5</option>
                            <option value="5-10">5-10</option>
                            <option value="10-15">10-15</option>
                            <option value="15-20">15-20</option>
                            <option value=">20">&gt;20</option>
                        </select>
                    </div>

                    <!-- Mucous Thread -->
                    <div class="col-md-6">
                        <label>Mucous Thread  ผลจากกล้องจุลทรรศน์</label>
                        <select class="form-select" name="Mucous Thread  ผลจากกล้องจุลทรรศน์">
                            <option value="" selected>-- เลือกค่า --</option>
                            <option value="Negative">Negative</option>
                            <option value="Few">Few</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Numerous">Numerous</option>
                        </select>
                    </div>

                    <!-- Bacteria -->
                    <div class="col-md-6">
                        <label>Bacteria ผลจากกล้องจุลทรรศน์</label>
                        <select class="form-select" name="Bacteria ผลจากกล้องจุลทรรศน์">
                            <option value="" selected>-- เลือกค่า --</option>
                            <option value="Negative">Negative</option>
                            <option value="Few">Few</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Numerous">Numerous</option>
                        </select>
                    </div>

                    <div class="col-12"><hr class="my-2 text-muted"></div>

                    <!-- ================= ชนิดเซลล์ เพิ่มเติม 1 ================= -->
                    <div class="col-md-6">
                        <label class="text-primary fw-bold">ชนิดเซลล์ เพิ่มเติม 1</label>
                        <select class="form-select border-primary" name="ชนิดเซลล์ เพิ่มเติม 1" id="cellType1Select" onchange="handleCellType1Change()">
                            <option value="" selected>-- เลือกประเภท --</option>
                            <option value="ไม่พบ">ไม่พบ</option>
                            <option value="Epithelial">Epithelial</option>
                            <option value="Cast">Cast</option>
                            <option value="Crystal">Crystal</option>
                            <option value="Yeast">Yeast</option>
                            <option value="Sperm">Sperm</option>
                            <option value="Dysmorphic red blood cell">Dysmorphic red blood cell</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <!-- Epithelial 1 -->
                        <div id="box-epithelial-1" class="conditional-box">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>ชนิด Epithelial เพิ่มเติม 1</label>
                                    <select class="form-select" name="ชนิด Epithelial เพิ่มเติม 1">
                                        <option value="" selected>-- เลือกชนิด Epithelial --</option>
                                        <option value="Bladder Epithelial">Bladder Epithelial</option>
                                        <option value="Renal Epithelial">Renal Epithelial</option>
                                        <option value="Caudate Epithelial">Caudate Epithelial</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label>Epithelial Cell เพิ่มเติม1  ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                                    <select class="form-select" name="Epithelial Cell เพิ่มเติม1  ผลจากกล้องจุลทรรศน์ [/HPF]">
                                        <option value="" selected>-- เลือกค่า --</option>
                                        <option value="Negative">Negative</option>
                                        <option value="0-1">0-1</option>
                                        <option value="1-2">1-2</option>
                                        <option value="2-3">2-3</option>
                                        <option value="3-5">3-5</option>
                                        <option value="5-10">5-10</option>
                                        <option value="10-15">10-15</option>
                                        <option value="15-20">15-20</option>
                                        <option value=">20">&gt;20</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Cast 1 -->
                        <div id="box-cast-1" class="conditional-box">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>ชนิด Cast เพิ่มเติม 1</label>
                                    <select class="form-select" name="ชนิด Cast เพิ่มเติม 1">
                                        <option value="" selected>-- เลือกชนิด Cast --</option>
                                        <option value="Hyaline cast">Hyaline cast</option>
                                        <option value="Granular cast">Granular cast</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label>Cast  เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/LPF]</label>
                                    <select class="form-select" name="Cast  เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/LPF]">
                                        <option value="" selected>-- เลือกค่า --</option>
                                        <option value="Negative">Negative</option>
                                        <option value="0-1">0-1</option>
                                        <option value="1-2">1-2</option>
                                        <option value="2-3">2-3</option>
                                        <option value="3-5">3-5</option>
                                        <option value="5-10">5-10</option>
                                        <option value="10-15">10-15</option>
                                        <option value="15-20">15-20</option>
                                        <option value=">20">&gt;20</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Crystal 1 -->
                        <div id="box-crystal-1" class="conditional-box">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>ชนิด Crystal เพิ่มเติม 1</label>
                                    <select class="form-select" name="ชนิด Crystal เพิ่มเติม 1">
                                        <option value="" selected>-- เลือกชนิด Crystal --</option>
                                        <option value="Calcium Oxalate crystal">Calcium Oxalate crystal</option>
                                        <option value="Uric acid crystal">Uric acid crystal</option>
                                        <option value="Triple phosphate crystal">Triple phosphate crystal</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label>Crystal เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                                    <select class="form-select" name="Crystal เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]">
                                        <option value="" selected>-- เลือกค่า --</option>
                                        <option value="Negative">Negative</option>
                                        <option value="Few">Few</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="Numerous">Numerous</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Yeast 1 -->
                        <div id="box-yeast-1" class="conditional-box">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>ชนิด Yeast เพิ่มเติม 1</label>
                                    <select class="form-select" name="Yeast เพิ่มเติม 1">
                                        <option value="" selected>-- เลือกชนิด Yeast --</option>
                                        <option value="Budding yeast">Budding yeast</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label>Yeast เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                                    <select class="form-select" name="Yeast เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]">
                                        <option value="" selected>-- เลือกค่า --</option>
                                        <option value="Negative">Negative</option>
                                        <option value="Few">Few</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="Numerous">Numerous</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Sperm 1 -->
                        <div id="box-sperm-1" class="conditional-box">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label>ชนิด Sperm เพิ่มเติม 1</label>
                                    <select class="form-select" name="Sperm เพิ่มเติม 1">
                                        <option value="" selected>-- เลือกชนิด Sperm --</option>
                                        <option value="Spermatozoa">Spermatozoa</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label>Sperm เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                                    <select class="form-select" name="Sperm เพิ่มเติม 1 ผลจากกล้องจุลทรรศน์ [/HPF]">
                                        <option value="" selected>-- เลือกค่า --</option>
                                        <option value="Negative">Negative</option>
                                        <option value="Few">Few</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="Numerous">Numerous</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Dysmorphic 1 -->
                        <div id="box-dysmorphic-1" class="conditional-box">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" name="Dysmorphic red blood cell" value="พบ" id="dysmorphicCheck1">
                                <label class="form-check-label fw-bold text-dark" for="dysmorphicCheck1">
                                    พบ Dysmorphic red blood cell
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- ================= Wrapper ชนิดเซลล์ เพิ่มเติม 2 ================= -->
                    <div id="wrapper-celltype2" class="col-12" style="display: none;">
                        <hr class="my-2 text-muted">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="text-info fw-bold">ชนิดเซลล์ เพิ่มเติม 2</label>
                                <select class="form-select border-info" name="ชนิดเซลล์ เพิ่มเติม 2" id="cellType2Select" onchange="handleCellType2Change()">
                                    <option value="" selected>-- เลือกประเภท --</option>
                                    <option value="ไม่พบ">ไม่พบ</option>
                                    <option value="Epithelial">Epithelial</option>
                                    <option value="Cast">Cast</option>
                                    <option value="Crystal">Crystal</option>
                                    <option value="Yeast">Yeast</option>
                                    <option value="Sperm">Sperm</option>
                                    <option value="Dysmorphic red blood cell">Dysmorphic red blood cell</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <!-- Epithelial 2 -->
                                <div id="box-epithelial-2" class="conditional-box-2">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label>ชนิด Epithelial เพิ่มเติม 2</label>
                                            <select class="form-select" name="ชนิด Epithelial เพิ่มเติม 2">
                                                <option value="" selected>-- เลือกชนิด Epithelial --</option>
                                                <option value="Bladder Epithelial">Bladder Epithelial</option>
                                                <option value="Renal Epithelial">Renal Epithelial</option>
                                                <option value="Caudate Epithelial">Caudate Epithelial</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label>Epithelial Cell เพิ่มเติม 2 ผลจากกล้องจุลทรรศน์ [/HPF]</label>
                                            <select class="form-select" name="Epithelial Cell เพิ่มเติม 2 ผลจากกล้องจุลทรรศน์ [/HPF]">
                                                <option value="" selected>-- เลือกค่า --</option>
                                                <option value="Negative">Negative</option>
                                                <option value="0-1">0-1</option>
                                                <option value="1-2">1-2</option>
                                                <option value="2-3">2-3</option>
                                                <option value="3-5">3-5</option>
                                                <option value="5-10">5-10</option>
                                                <option value="10-15">10-15</option>
                                                <option value="15-20">15-20</option>
                                                <option value=">20">&gt;20</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- Cast 2 -->
                                <div id="box-cast-2" class="conditional-box-2">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label>ชนิด Cast เพิ่มเติม 2</label>
                                            <select class="form-select" name="ชนิด Cast เพิ่มเติม 2">
                                                <option value="" selected>-- เลือกชนิด Cast --</option>
                                                <option value="Hyaline cast">Hyaline cast</option>
                                                <option value="Granular cast">Granular cast</option>
                                            </select>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbymiw0hym5BPBm5mfpMXo5_gXrLTf6Oykq9UAwmxAy4SwYM9yovZtsc-DBucxFs24F4Vw/exec';

    // ================= การจัดการ Multi-step =================
    let currentTab = 0; showTab(currentTab); 
    function showTab(n) {
        let x = document.getElementsByClassName("step"); x[n].classList.add("active");
        document.getElementById("prevBtn").style.display = (n == 0) ? "none" : "inline";
        let nextBtn = document.getElementById("nextBtn");
        if (n == (x.length - 1)) {
            nextBtn.innerHTML = "บันทึกข้อมูล <i class='fa-solid fa-paper-plane ms-2'></i>";
            nextBtn.className = "btn btn-success px-5 fw-bold";
        } else {
            nextBtn.innerHTML = "ถัดไป <i class='fa-solid fa-arrow-right ms-2'></i>";
            nextBtn.className = "btn btn-primary px-5 fw-bold";
        }
        updateStepIndicator(n);
        
        if (n === 1) { setTimeout(() => { document.getElementById("sampleId").focus(); }, 100); }
    }

    function nextPrev(n) {
        let x = document.getElementsByClassName("step");
        if (n == 1 && !validateForm()) return false;
        
        if(html5QrCode && isScanning) { stopCameraScan(); }

        x[currentTab].classList.remove("active");
        currentTab = currentTab + n;
        if (currentTab >= x.length) { submitForm(); currentTab = currentTab - n; x[currentTab].classList.add("active"); return false; }
        showTab(currentTab);
    }

    function validateForm() {
        let x = document.getElementsByClassName("step");
        let inputs = x[currentTab].querySelectorAll("input[required], select[required]");
        let valid = true;
        for (let i = 0; i < inputs.length; i++) {
            if (!inputs[i].checkValidity()) { inputs[i].reportValidity(); valid = false; break; }
        }
        if (currentTab === 1 && valid) {
            let sampleId = document.getElementById("sampleId").value;
            if(sampleId.length < 9 || sampleId.length > 20) {
                document.getElementById('barcodeHelper').innerHTML = '<span class="text-danger fw-bold">❌ กรุณากรอกหมายเลข 9 - 20 หลัก</span>';
                document.getElementById("sampleId").focus();
                return false;
            }
        }
        return valid;
    }

    function updateStepIndicator(n) {
        let dots = document.getElementsByClassName("step-dot");
        for (let i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "").replace(" completed", "");
            if (i < n) dots[i].className += " completed";
        }
        dots[n].className += " active";
    }

    // Auto Timestamp Format: DD/MM/YYYY, HH:mm:ss
    function setInitialTimestamp() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('timestampInput').value = `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
    }
    setInitialTimestamp();

    // ================= Dynamic fields: ชนิดเซลล์ เพิ่มเติม 1 =================
    function handleCellType1Change() {
        const selectedValue = document.getElementById('cellType1Select').value;
        const boxes = document.querySelectorAll('.conditional-box');
        
        boxes.forEach(box => {
            box.style.display = 'none';
            box.querySelectorAll('select').forEach(sel => sel.value = '');
            box.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
        });

        if (selectedValue === 'Epithelial') document.getElementById('box-epithelial-1').style.display = 'block';
        else if (selectedValue === 'Cast') document.getElementById('box-cast-1').style.display = 'block';
        else if (selectedValue === 'Crystal') document.getElementById('box-crystal-1').style.display = 'block';
        else if (selectedValue === 'Yeast') document.getElementById('box-yeast-1').style.display = 'block';
        else if (selectedValue === 'Sperm') document.getElementById('box-sperm-1').style.display = 'block';
        else if (selectedValue === 'Dysmorphic red blood cell') {
            document.getElementById('box-dysmorphic-1').style.display = 'block';
            document.getElementById('dysmorphicCheck1').checked = true;
        }

        const wrapper2 = document.getElementById('wrapper-celltype2');
        if (selectedValue !== '' && selectedValue !== 'ไม่พบ') {
            wrapper2.style.display = 'block';
        } else {
            wrapper2.style.display = 'none';
            document.getElementById('cellType2Select').value = '';
            handleCellType2Change();
        }
    }

    // ================= Dynamic fields: ชนิดเซลล์ เพิ่มเติม 2 =================
    function handleCellType2Change() {
        const selectedValue = document.getElementById('cellType2Select').value;
        const boxes = document.querySelectorAll('.conditional-box-2');
        
        boxes.forEach(box => {
            box.style.display = 'none';
            box.querySelectorAll('select').forEach(sel => sel.value = '');
            box.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
        });

        if (selectedValue === 'Epithelial') document.getElementById('box-epithelial-2').style.display = 'block';
        else if (selectedValue === 'Cast') document.getElementById('box-cast-2').style.display = 'block';
        else if (selectedValue === 'Crystal') document.getElementById('box-crystal-2').style.display = 'block';
        else if (selectedValue === 'Yeast') document.getElementById('box-yeast-2').style.display = 'block';
        else if (selectedValue === 'Sperm') document.getElementById('box-sperm-2').style.display = 'block';
        else if (selectedValue === 'Dysmorphic red blood cell') {
            document.getElementById('box-dysmorphic-2').style.display = 'block';
            document.getElementById('dysmorphicCheck2').checked = true;
        }

        const wrapper3 = document.getElementById('wrapper-celltype3');
        if (selectedValue !== '' && selectedValue !== 'ไม่พบ') {
            wrapper3.style.display = 'block';
        } else {
            wrapper3.style.display = 'none';
            document.getElementById('cellType3Select').value = '';
            handleCellType3Change();
        }
    }

    // ================= Dynamic fields: ชนิดเซลล์ เพิ่มเติม 3 =================
    function handleCellType3Change() {
        const selectedValue = document.getElementById('cellType3Select').value;
        const boxes = document.querySelectorAll('.conditional-box-3');
        
        boxes.forEach(box => {
            box.style.display = 'none';
            box.querySelectorAll('select').forEach(sel => sel.value = '');
            box.querySelectorAll('input[type="checkbox"]').forEach(chk => chk.checked = false);
        });

        if (selectedValue === 'Epithelial') document.getElementById('box-epithelial-3').style.display = 'block';
        else if (selectedValue === 'Cast') document.getElementById('box-cast-3').style.display = 'block';
        else if (selectedValue === 'Crystal') document.getElementById('box-crystal-3').style.display = 'block';
        else if (selectedValue === 'Yeast') document.getElementById('box-yeast-3').style.display = 'block';
        else if (selectedValue === 'Sperm') document.getElementById('box-sperm-3').style.display = 'block';
        else if (selectedValue === 'Dysmorphic red blood cell') {
            document.getElementById('box-dysmorphic-3').style.display = 'block';

        }
    }

    function setAllAutoNegative() {
        document.querySelectorAll('.auto-select').forEach(select => {
            select.value = 'Negative';
        });
    }

    // ================= ระบบสแกน Barcode ผ่านกล้องมือถือ =================
    let html5QrCode;
    let isScanning = false;

    function startCameraScan() {
        const readerElement = document.getElementById('reader');
        const startBtn = document.getElementById('startCameraBtn');
        
        if(isScanning) { stopCameraScan(); return; }

        readerElement.style.display = "block";
        startBtn.innerHTML = '<i class="fa-solid fa-stop"></i> ปิดกล้อง';
        startBtn.classList.replace('btn-primary', 'btn-danger');

        html5QrCode = new Html5Qrcode("reader");
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 300, height: 150 } },
            (decodedText, decodedResult) => {
                let cleanText = decodedText.replace(/[^0-9]/g, '');
                document.getElementById('sampleId').value = cleanText;
                document.getElementById('sampleId').dispatchEvent(new Event('input'));
                
                stopCameraScan();
                
                if(cleanText.length >= 9 && cleanText.length <= 20) {
                    setTimeout(() => { document.getElementById('nextBtn').click(); }, 400);
                }
            },
            (errorMessage) => { }
        ).then(() => {
            isScanning = true;
        }).catch((err) => {
            alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้เว็บไซต์เข้าถึงกล้องของคุณ");
            stopCameraScan();
        });
    }

    function stopCameraScan() {
        if(html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = "none";
                const startBtn = document.getElementById('startCameraBtn');
                startBtn.innerHTML = '<i class="fa-solid fa-camera"></i> เปิดกล้อง';
                startBtn.classList.replace('btn-danger', 'btn-primary');
                isScanning = false;
            }).catch((err) => { console.log(err); });
        }
    }

    // ================= Input Validation =================
    const sampleIdInput = document.getElementById('sampleId');

    function clearBarcode() {
        sampleIdInput.value = '';
        sampleIdInput.dispatchEvent(new Event('input'));
        sampleIdInput.focus();
    }

    sampleIdInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, ''); 
        const len = this.value.length;
        if(len >= 9 && len <= 20) {
            this.classList.replace('border-primary', 'border-success');
            this.classList.replace('border-danger', 'border-success');
            document.getElementById('barcodeHelper').innerHTML = `<span class="text-success fw-bold">✅ ถูกต้อง (${len} หลัก)</span>`;
        } else {
            this.classList.replace('border-success', 'border-primary');
            this.classList.replace('border-danger', 'border-primary');
            document.getElementById('barcodeHelper').innerHTML = `กดปุ่ม "เปิดกล้อง" หรือใช้เครื่องสแกน (ปัจจุบัน ${len} หลัก)`;
        }
    });

    sampleIdInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); 
            const len = this.value.length;
            if (len >= 9 && len <= 20) {
                document.getElementById('nextBtn').click(); 
            } else {
                this.classList.replace('border-primary', 'border-danger');
                document.getElementById('barcodeHelper').innerHTML = `<span class="text-danger fw-bold">❌ ต้องมี 9 - 20 หลัก (ปัจจุบัน ${len} หลัก)</span>`;
                this.style.animation = 'shake 0.5s';
                setTimeout(() => { this.style.animation = ''; }, 500);
            }
        }
    });

    // ================= ส่งข้อมูลไป GAS (พร้อมแปลงช่วงตัวเลขเติม ' นำหน้า) =================
    async function submitForm() {
        const form = document.getElementById('urinalysisForm');
        const nextBtn = document.getElementById('nextBtn');
        const alertBox = document.getElementById('alertBox');
        
        nextBtn.disabled = true; document.getElementById('prevBtn').disabled = true;
        nextBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
        
        const formData = new FormData(form);
        const dataObject = {};

        // ตรวจสอบข้อมูลก่อนส่ง: ถ้าเป็นค่าช่วงตัวเลข (เช่น 0-1, 1-2, >20) ให้เติม ' นำหน้า
        for (let [key, value] of formData.entries()) {
            if (/^(\d+-\d+|>\d+)$/.test(value)) {
                dataObject[key] = "'" + value;
            } else {
                dataObject[key] = value;
            }
        }

        try {
            const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(dataObject) });
            const result = await response.json();
            
            if(result.status === 'success') {
                alertBox.innerHTML = `<div class="alert alert-success fw-bold text-center mt-3">✅ บันทึกหมายเลข ${dataObject['หมายเลขบนตัวอย่าง']} สำเร็จ!</div>`;
                
                form.reset(); 
                setInitialTimestamp();
                clearBarcode();
                handleCellType1Change();
                
                document.getElementsByClassName("step")[currentTab].classList.remove("active");
                currentTab = 0; 
                showTab(currentTab);
                
            } else throw new Error(result.message);
        } catch (error) {
            alertBox.innerHTML = `<div class="alert alert-danger mt-3">❌ เกิดข้อผิดพลาด: ${error.message}</div>`;
        } finally {
            nextBtn.disabled = false; document.getElementById('prevBtn').disabled = false;
            nextBtn.innerHTML = "บันทึกข้อมูล <i class='fa-solid fa-paper-plane ms-2'></i>";
            setTimeout(() => { alertBox.innerHTML = ''; }, 4000);
        }
    }
</script>
